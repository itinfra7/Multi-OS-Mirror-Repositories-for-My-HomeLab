# Credits: itinfra7 from GitHub
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /storage/www;
    index index.html;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location = /monitor { return 302 /monitor/; }
    location /monitor/ { root /storage/www; index index.html; add_header Cache-Control "no-store"; }
    location ~ ^/monitor/(alpine|opencsw|openbsd|omnios|openindiana)/?$ { return 308 /monitor/#repo-$1; }
    location ~ ^/monitor/(alpine|opencsw|openbsd|omnios|openindiana)/ { return 404; }

    location = /api/mirrors/traffic.json {
        proxy_pass http://127.0.0.1:18080/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /api/mirrors/limit/toggle {
        proxy_pass http://127.0.0.1:18080/toggle;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /api/mirrors/limit/set-rate {
        proxy_pass http://127.0.0.1:18080/set-rate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /api/alpine/status.json { alias /storage/alpine/.monitor/status.json; add_header Cache-Control "no-store"; }

    location = /api/opencsw/status.json { alias /storage/opencsw/.monitor/status.json; add_header Cache-Control "no-store"; }
    location = /api/opencsw/remote-total.json { alias /storage/opencsw/.monitor/remote-total.json; add_header Cache-Control "no-store"; }

    location = /api/openbsd/status.json { alias /storage/openbsd/.monitor/status.json; add_header Cache-Control "no-store"; }

    location = /api/omnios/status.json { alias /storage/omnios/.monitor/status.json; add_header Cache-Control "no-store"; }

    location = /api/openindiana/status.json { alias /storage/openindiana/.monitor/status.json; add_header Cache-Control "no-store"; }

    location ~ ^/(alpine|opencsw|openbsd|omnios|openindiana)/monitor(?:/|$) { return 404; }

    location = /alpine { return 302 /alpine/; }
    location /alpine/ { alias /storage/alpine/; autoindex on; autoindex_exact_size off; autoindex_localtime on; }

    location = /opencsw { return 302 /opencsw/; }
    location /opencsw/ { alias /storage/opencsw/; autoindex on; autoindex_exact_size off; autoindex_localtime on; add_header Cache-Control "public, max-age=300"; }

    location = /openbsd { return 302 /openbsd/; }
    location /openbsd/ { alias /storage/openbsd/; autoindex on; autoindex_exact_size off; autoindex_localtime on; add_header Cache-Control "public, max-age=300"; }

    location = /omnios { return 302 /omnios/; }
    location /omnios/ { alias /storage/omnios/; autoindex on; autoindex_exact_size off; autoindex_localtime on; add_header Cache-Control "public, max-age=300"; }

    location = /openindiana { return 302 /openindiana/; }
    location /openindiana/ { alias /storage/openindiana/; autoindex on; autoindex_exact_size off; autoindex_localtime on; add_header Cache-Control "public, max-age=300"; }

    location = / {
        index __root_autoindex_only__;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "public, max-age=30";
    }
    location ~ /\. { deny all; }
}
